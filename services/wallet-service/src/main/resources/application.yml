server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${POSTGRES_USER:omnibid}
    password: ${POSTGRES_PASSWORD:omnibid}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:omnibid}
    password: ${RABBITMQ_DEFAULT_PASS:omnibid}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 3
          max-interval: 5s

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info

omnibid:
  rabbitmq:
    refund-exchange: refund-exchange
    refund-routing-key: refund.requested
    refund-queue: refund-queue
    refund-dlx: refund-dlx
    refund-dlq: refund-dlq
