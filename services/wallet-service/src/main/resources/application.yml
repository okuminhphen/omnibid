server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${POSTGRES_USER:omnibid}
    password: ${POSTGRES_PASSWORD:omnibid}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:omnibid}
    password: ${RABBITMQ_DEFAULT_PASS:omnibid}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 3
          max-interval: 5s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${WALLET_IDENTITY_CONSUMER_GROUP:wallet-identity-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:3000}}
  jwt:
    jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8083/.well-known/jwks.json}
    issuer: ${OMNIBID_TOKEN_ISSUER:http://localhost:8083}
    audience: ${OMNIBID_TOKEN_AUDIENCE:omnibid-api}

omnibid:
  kafka:
    identity-topic: ${IDENTITY_TOPIC:identity-events}
  rabbitmq:
    refund-exchange: ${REFUND_EXCHANGE:auction.exchange}
    refund-routing-key: ${REFUND_ROUTING_KEY:auction.refund}
    refund-queue: ${REFUND_QUEUE:wallet.refund.queue}
    refund-dlx: ${REFUND_DLX:auction.refund.dlx}
    refund-dlq: ${REFUND_DLQ:wallet.refund.dlq}
    refund-dead-letter-routing-key: ${REFUND_DLQ_ROUTING_KEY:auction.refund.failed}
