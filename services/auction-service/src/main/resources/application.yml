server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auction-service
  datasource:
    url: ${AUCTION_DB_URL:jdbc:postgresql://localhost:5432/auction_db}
    username: ${POSTGRES_USER:omnibid}
    password: ${POSTGRES_PASSWORD:omnibid}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:omnibid}
    password: ${RABBITMQ_DEFAULT_PASS:omnibid}
    publisher-confirm-type: correlated
    publisher-returns: true

grpc:
  client:
    wallet-service:
      address: ${WALLET_GRPC_TARGET:static://localhost:9091}
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:3000}}
  jwt:
    jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8083/.well-known/jwks.json}
    issuer: ${OMNIBID_TOKEN_ISSUER:http://localhost:8083}
    audience: ${OMNIBID_TOKEN_AUDIENCE:omnibid-api}

omnibid:
  outbox:
    fixed-delay-ms: ${AUCTION_OUTBOX_DELAY_MS:1000}
  auction:
    auto-end-delay-ms: ${AUCTION_AUTO_END_DELAY_MS:5000}
  kafka:
    bid-topic: ${BID_TOPIC:bid-events}
  rabbitmq:
    refund-exchange: ${REFUND_EXCHANGE:auction.exchange}
    refund-routing-key: ${REFUND_ROUTING_KEY:auction.refund}
