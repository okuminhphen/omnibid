server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: audit-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/omnibid_audit}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${AUDIT_CONSUMER_GROUP:audit-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    listener:
      ack-mode: record

omnibid:
  kafka:
    bid-topic: ${BID_TOPIC:bid-events}
    consumer-group: ${AUDIT_CONSUMER_GROUP:audit-group}

management:
  endpoints:
    web:
      exposure:
        include: health,info
