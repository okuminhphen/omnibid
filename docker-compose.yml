name: omnibid

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnibid-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnibid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnibid}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnibid} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [omnibid-network]

  mongodb:
    image: mongo:7-jammy
    container_name: omnibid-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [omnibid-network]

  redis:
    image: redis:7.4-alpine
    container_name: omnibid-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [omnibid-network]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: omnibid-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-omnibid}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-omnibid}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [omnibid-network]

  redpanda:
    image: redpandadata/redpanda:v24.2.10
    container_name: omnibid-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [omnibid-network]

  localstack:
    image: localstack/localstack:3.8
    container_name: omnibid-localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-southeast-1
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -Eq '\"s3\": \"(running|available)\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [omnibid-network]

networks:
  omnibid-network:
    name: omnibid-network

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
  redpanda-data:
  localstack-data:
